checks:
  addAllBuiltIn: false
  include:
    - no-read-only-root-fs
    - run-as-non-root
    - unset-cpu-requirements
    - unset-memory-requirements
    - no-liveness-probe
    - no-readiness-probe
    - privileged-container
    - privilege-escalation-container
    - drop-net-raw-capability
    - latest-tag
    - dangling-service
    - mismatching-selector

customChecks: []

# Deliberately NOT included:
#   minimum-three-replicas / no-anti-affinity - the brief asks for 2 replicas on
#   a local single-node cluster, where 3 replicas plus hard anti-affinity would
#   leave a pod Pending forever. Spreading is handled with a soft
#   topologySpreadConstraint instead. In a real multi-node prod cluster both
#   checks would be enabled.
#
# mismatching-selector is the check that would have caught Q1 in review.
