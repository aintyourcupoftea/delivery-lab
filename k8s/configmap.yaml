apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-lab-config
  namespace: delivery-lab
  labels:
    app.kubernetes.io/name: delivery-lab
data:
  # Non-secret runtime configuration only. Secrets would live in a Secret
  # (ideally projected from External Secrets / a cloud secret manager), never
  # here - ConfigMap data is plaintext to anyone with get on the namespace.
  APP_VERSION: "1.0.0"
  READY: "true"
  WORK_DELAY: "0"
  PORT: "8080"
  # Lame-duck window: seconds to keep serving after SIGTERM while readiness
  # returns 503, so endpoints/proxies deprogram before the socket closes.
  DRAIN_SECONDS: "5"
  # Max seconds uvicorn waits for in-flight requests after the drain window.
  GRACEFUL_TIMEOUT: "20"
